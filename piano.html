<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Piano Studio</title>
  <style>
    :root {
      --bg: #0c0a0e;
      --panel: rgba(28, 24, 32, 0.88);
      --ink: #f2ede6;
      --muted: #9b939e;
      --gold: #f2b632;
      --red: #c8102e;
      --blue: #2a4fb8;
      --key-white: #f4efe6;
      --key-black: #2d0a0f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
    }

    canvas#waveBg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* --- Screens --- */
    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      z-index: 10;
      padding: 20px;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      font-size: 28px;
      margin: 0;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p.sub {
      color: var(--muted);
      font-size: 14px;
      max-width: 420px;
      line-height: 1.5;
      margin: 0;
    }

    /* --- Cards & Buttons --- */
    .card {
      background: var(--panel);
      border: 1px solid rgba(242, 182, 50, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px 24px;
      width: min(90vw, 360px);
      cursor: pointer;
      text-align: left;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }

    .card:hover {
      border-color: var(--gold);
      box-shadow: 0 0 20px rgba(242, 182, 50, 0.15);
    }

    .card:active {
      transform: scale(0.97);
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .card span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      display: block;
    }

    .primary-btn {
      background: var(--gold);
      color: #111;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(242, 182, 50, 0.3);
      transition: transform 100ms ease;
    }

    .primary-btn:active {
      transform: scale(0.96);
    }

    /* --- Workspace UI --- */
    #ui-layer {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
    }

    .top-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .tutorial-panel {
      background: var(--panel);
      border: 1px solid rgba(242, 182, 50, 0.3);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      backdrop-filter: blur(12px);
    }

    .controls-row {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
    }

    .controls-row label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .controls-row input[type="range"] {
      accent-color: var(--gold);
      width: 80px;
    }

    /* --- Coach / Target Box --- */
    .coach-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      margin-bottom: 10px;
    }

    #coach-target {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      background: var(--gold);
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 0 25px rgba(242, 182, 50, 0.5);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    #coach-target.hit {
      transform: scale(0.88);
      box-shadow: 0 0 45px rgba(242, 182, 50, 0.9);
    }

    .chips-row {
      display: flex;
      gap: 8px;
    }

    .chip {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* --- Proportioned Piano --- */
    .piano-wrapper {
      width: min(96vw, 860px);
      background: #120e12;
      padding: 12px 14px 16px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.1);
    }

    .piano-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 8px 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    #keyboard-container {
      width: 100%;
      height: 190px;
      position: relative;
      display: flex;
      border-radius: 6px;
      overflow: hidden;
      background: #080608;
    }

    .key {
      border: 1px solid #221d22;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      position: relative;
      transition: background 0.06s ease, transform 0.06s ease;
    }

    .key.white {
      flex: 1;
      background: var(--key-white);
      z-index: 1;
      box-shadow: inset 0 -8px 10px rgba(0, 0, 0, 0.15), inset -1px 0 2px rgba(0, 0, 0, 0.05);
    }

    .key.white.active {
      background: #dcd3c4;
      transform: translateY(2px);
    }

    .key.black {
      position: absolute;
      top: 0;
      background: var(--key-black);
      z-index: 2;
      height: 60%;
      border-radius: 0 0 5px 5px;
      box-shadow: inset 0 -5px 6px rgba(0, 0, 0, 0.6), 0 4px 8px rgba(0, 0, 0, 0.4);
      border: 1px solid #160306;
    }

    .key.black.active {
      background: #160406;
      transform: translateY(2px);
    }

    /* Target key glow */
    .key.target {
      background: var(--gold) !important;
      box-shadow: 0 0 25px var(--gold), inset 0 0 10px #fff !important;
      z-index: 3 !important;
    }

    .key .label-key {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 800;
      color: #444;
      pointer-events: none;
    }

    .key .label-note {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 700;
      color: #999;
      pointer-events: none;
    }

    .key.black .label-key {
      bottom: 12px;
      color: #f2b632;
      font-size: 12px;
    }

    .key.black .label-note {
      top: 8px;
      color: #b88a91;
      font-size: 9px;
    }

    .key.target .label-key {
      color: #000;
      font-size: 16px;
      font-weight: 900;
    }

    .key.target .label-note {
      color: #222;
    }

    .score-val {
      font-size: 64px;
      font-weight: 900;
      color: var(--gold);
      margin: 10px 0;
    }
  </style>
</head>

<body>

  <!-- Background Visual Canvas -->
  <canvas id="waveBg"></canvas>

  <!-- 1. START SCREEN -->
  <div id="screen-start" class="screen active">
    <h1>Piano Studio</h1>
    <p class="sub">Choose a mode below to start playing.</p>

    <div class="card" id="btnRunaway">
      <h3>Runaway — Kanye West (Tutorial)</h3>
      <span>Authentic 2-cycle intro motif (56 notes)</span>
    </div>

    <div class="card" id="btnFreePlay">
      <h3>Normal Piano</h3>
      <span>Free play • Standard octave starting at C4</span>
    </div>
  </div>

  <!-- 2. PIANO WORKSPACE -->
  <div id="screen-piano" class="screen" style="z-index: 5; padding: 0;">
    <div id="ui-layer">

      <div class="top-bar">
        <button class="back-btn" id="btnBack">← Back</button>

        <div id="tutorial-controls" class="tutorial-panel" style="display: none;">
          <div class="controls-row">
            <label><input type="radio" name="playMode" value="wait" checked> Wait for me</label>
            <label><input type="radio" name="playMode" value="timed"> Timed</label>
          </div>
          <div class="controls-row">
            <span>Tempo:</span>
            <input type="range" id="tempo" min="40" max="140" value="87">
            <span id="tempo-val" style="width: 50px;">87 BPM</span>
          </div>
        </div>

        <div style="width: 70px;"></div>
      </div>

      <!-- Coach Box (Tutorial) -->
      <div id="coach-area" class="coach-container" style="display: none;">
        <div id="coach-target">;</div>
        <div class="chips-row">
          <div class="chip" id="chip-1"></div>
          <div class="chip" id="chip-2"></div>
          <div class="chip" id="chip-3"></div>
        </div>
      </div>

      <!-- Piano Keyboard Unit -->
      <div class="piano-wrapper">
        <div class="piano-header">
          <span>Keyboard Map: Home Row &amp; Above</span>
          <span id="mode-badge">Free Play</span>
        </div>
        <div id="keyboard-container"></div>
      </div>

    </div>
  </div>

  <!-- 3. END SCREEN -->
  <div id="screen-end" class="screen">
    <h1>Tutorial Complete</h1>
    <p class="sub">Total notes correctly hit:</p>
    <div class="score-val" id="hit-count">0 / 0</div>
    <button class="primary-btn" id="btnEndBack">Back to Start</button>
  </div>

  <script>
    (function () {
      // --- Audio Synthesis Engine ---
      let ctx = null;
      function ensureCtx() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === "suspended") ctx.resume();
      }

      document.body.addEventListener('pointerdown', ensureCtx, { once: true });
      document.body.addEventListener('keydown', ensureCtx, { once: true });

      let pulse = 0;

      function playNoteEngine(freq) {
        pulse = 1;
        ensureCtx();
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now);

        const subOsc = ctx.createOscillator();
        subOsc.type = "sine";
        subOsc.frequency.setValueAtTime(freq * 2, now);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.6);

        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 2400;

        osc.connect(filter);
        subOsc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now); subOsc.start(now);
        osc.stop(now + 1.8); subOsc.stop(now + 1.8);
      }

      // --- Keyboard Mapping ---
      const KEYS_CONFIG = [
        { key: 'A', note: 'C4', freq: 261.63, isBlack: false },
        { key: 'W', note: 'C#4', freq: 277.18, isBlack: true },
        { key: 'S', note: 'D4', freq: 293.66, isBlack: false },
        { key: 'E', note: 'D#4', freq: 311.13, isBlack: true },
        { key: 'D', note: 'E4', freq: 329.63, isBlack: false },
        { key: 'F', note: 'F4', freq: 349.23, isBlack: false },
        { key: 'T', note: 'F#4', freq: 369.99, isBlack: true },
        { key: 'G', note: 'G4', freq: 392.00, isBlack: false },
        { key: 'Y', note: 'G#4', freq: 415.30, isBlack: true },
        { key: 'H', note: 'A4', freq: 440.00, isBlack: false },
        { key: 'U', note: 'A#4', freq: 466.16, isBlack: true },
        { key: 'J', note: 'B4', freq: 493.88, isBlack: false },
        { key: 'K', note: 'C5', freq: 523.25, isBlack: false },
        { key: 'O', note: 'C#5', freq: 554.37, isBlack: true },
        { key: 'L', note: 'D5', freq: 587.33, isBlack: false },
        { key: 'P', note: 'D#5', freq: 622.25, isBlack: true },
        { key: ';', note: 'E5', freq: 659.25, isBlack: false }
      ];

      function getKeyEl(keyChar) {
        return Array.from(document.querySelectorAll('.key')).find(el => el.dataset.key === keyChar);
      }

      function buildKeyboard() {
        const container = document.getElementById('keyboard-container');
        container.innerHTML = '';

        const whites = KEYS_CONFIG.filter(k => !k.isBlack);
        const blacks = KEYS_CONFIG.filter(k => k.isBlack);
        const wCount = whites.length;
        const bw = (100 / wCount) * 0.62;

        whites.forEach(k => {
          let el = document.createElement('div');
          el.className = 'key white';
          el.dataset.key = k.key;
          el.innerHTML = `<span class="label-note">${k.note}</span><span class="label-key">${k.key}</span>`;
          container.appendChild(el);
        });

        blacks.forEach(k => {
          let el = document.createElement('div');
          el.className = 'key black';
          el.dataset.key = k.key;
          el.innerHTML = `<span class="label-note">${k.note}</span><span class="label-key">${k.key}</span>`;

          let prevWhiteIdx = whites.findIndex(w => KEYS_CONFIG.indexOf(w) < KEYS_CONFIG.indexOf(k) && KEYS_CONFIG.indexOf(w) === KEYS_CONFIG.indexOf(k) - 1);
          el.style.width = bw + '%';
          el.style.left = `calc(${(prevWhiteIdx + 1) * (100 / wCount)}% - ${bw / 2}%)`;
          container.appendChild(el);
        });
      }
      buildKeyboard();

      // --- Background Visuals ---
      const canvas = document.getElementById("waveBg");
      const wctx = canvas.getContext("2d");
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resize(); window.addEventListener("resize", resize);

      let t = 0;
      function drawWave() {
        t += 0.025;
        pulse *= 0.88;
        const w = canvas.width, h = canvas.height;

        let grad = wctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#0c0a0e');
        grad.addColorStop(1, '#180e14');
        wctx.fillStyle = grad;
        wctx.fillRect(0, 0, w, h);

        const layers = [
          { f: 0.004, s: 1.0, amp: 26, color: 'rgba(200, 16, 46, ' },   // Red
          { f: 0.007, s: -1.2, amp: 18, color: 'rgba(242, 182, 50, ' }, // Gold
          { f: 0.011, s: 1.5, amp: 12, color: 'rgba(42, 79, 184, ' }    // Deep Blue
        ];

        layers.forEach((L, i) => {
          wctx.beginPath();
          const midY = h * (0.32 + i * 0.2);
          for (let x = 0; x <= w; x += 8) {
            const y = midY + Math.sin(x * L.f + t * L.s) * (L.amp + pulse * 70);
            if (x === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
          }
          wctx.strokeStyle = L.color + (0.35 + pulse * 0.45) + ")";
          wctx.lineWidth = 3; wctx.stroke();
        });
        requestAnimationFrame(drawWave);
      }
      requestAnimationFrame(drawWave);

      // --- AUTHENTIC RUNAWAY INTRO TUTORIAL (Kanye West) ---
      // Real musical motif:
      // Phrase 1 (Bars 1-4): 15x High E (E5) -> 1x Octave drop to Low E (E4)
      // Phrase 2 (Bar 5):     3x High D# (D#5) -> 1x Octave drop to Low D# (D#4)
      // Phrase 3 (Bar 6):     3x High C# (C#5) -> 1x Octave drop to Low C# (C#4)
      // Phrase 4 (Bars 7-8):  2x A4 -> 1x G#4 -> 1x High E (E5 held through resolution)
      const RUNAWAY_CYCLE = [
        // Phrase 1 (Bars 1-4): 15x High E (;) -> 1x Low E (D)
        ...Array(15).fill(null).map(() => ({ key: ";", beats: 1 })),
        { key: "D", beats: 1 },

        // Phrase 2 (Bar 5): 3x High D# (P) -> 1x Low D# (E)
        { key: "P", beats: 1 },
        { key: "P", beats: 1 },
        { key: "P", beats: 1 },
        { key: "E", beats: 1 },

        // Phrase 3 (Bar 6): 3x High C# (O) -> 1x Low C# (W)
        { key: "O", beats: 1 },
        { key: "O", beats: 1 },
        { key: "O", beats: 1 },
        { key: "W", beats: 1 },

        // Phrase 4 (Bars 7-8): A (H) -> A (H) -> G# (Y) -> High E (;) held
        { key: "H", beats: 1 },
        { key: "H", beats: 1 },
        { key: "Y", beats: 1 },
        { key: ";", beats: 3 }
      ];

      // Two full cycles of the iconic theme (56 notes)
      const SONG = [
        ...RUNAWAY_CYCLE,
        ...RUNAWAY_CYCLE
      ];

      let currentMode = 'free';
      let tutorialState = { index: 0, hits: 0, timer: null, waitingForInput: false };

      function show(id) {
        document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      }

      // --- Navigation & Controls ---
      document.getElementById("btnFreePlay").addEventListener("click", () => {
        currentMode = 'free';
        document.getElementById('tutorial-controls').style.display = 'none';
        document.getElementById('coach-area').style.display = 'none';
        document.getElementById('mode-badge').innerText = 'Free Play Mode';
        show("screen-piano");
      });

      document.getElementById("btnRunaway").addEventListener("click", () => {
        currentMode = 'tutorial';
        tutorialState = { index: 0, hits: 0, timer: null, waitingForInput: false };
        document.getElementById('tutorial-controls').style.display = 'flex';
        document.getElementById('coach-area').style.display = 'flex';
        document.getElementById('mode-badge').innerText = 'Runaway Tutorial';
        show("screen-piano");
        nextCue();
      });

      document.getElementById("btnBack").addEventListener("click", () => {
        stopTutorial();
        show("screen-start");
      });

      document.getElementById("btnEndBack").addEventListener("click", () => show("screen-start"));

      document.getElementById("tempo").addEventListener("input", e => {
        document.getElementById("tempo-val").innerText = e.target.value + " BPM";
      });

      // --- Tutorial Engine ---
      function stopTutorial() {
        if (tutorialState.timer) clearTimeout(tutorialState.timer);
        tutorialState.timer = null;
        tutorialState.waitingForInput = false;
        unhighlightKeys();
      }

      function getBeatDuration(beats) {
        const bpm = parseInt(document.getElementById("tempo").value) || 87;
        return (60 / bpm) * beats * 1000;
      }

      function unhighlightKeys() {
        document.querySelectorAll('.key.target').forEach(el => el.classList.remove('target'));
      }

      function updateCoachUI(step) {
        const cfg = KEYS_CONFIG.find(k => k.key === (step.key || '').toUpperCase());
        const noteName = cfg ? cfg.note : '';
        document.getElementById('coach-target').innerHTML = `<span>${step.key || '-'}</span>${noteName ? `<span style="font-size:12px; font-weight:700; opacity:0.8; margin-top:2px;">${noteName}</span>` : ''}`;
        for (let i = 1; i <= 3; i++) {
          const chip = document.getElementById(`chip-${i}`);
          const futureStep = SONG[tutorialState.index + i];
          if (futureStep) {
            chip.innerText = futureStep.key || '-';
            chip.style.visibility = 'visible';
          } else {
            chip.style.visibility = 'hidden';
          }
        }
      }

      function nextCue() {
        if (tutorialState.index >= SONG.length) {
          stopTutorial();
          document.getElementById('hit-count').innerText = `${tutorialState.hits} / ${SONG.length}`;
          show("screen-end");
          return;
        }

        const step = SONG[tutorialState.index];

        if (!step.key) {
          updateCoachUI(step);
          unhighlightKeys();
          tutorialState.timer = setTimeout(() => {
            tutorialState.index++;
            nextCue();
          }, getBeatDuration(step.beats));
          return;
        }

        updateCoachUI(step);

        // Highlight Target Key
        const keyEl = getKeyEl(step.key.toUpperCase());
        if (keyEl) keyEl.classList.add('target');

        const playMode = document.querySelector('input[name="playMode"]:checked').value;
        tutorialState.waitingForInput = true;

        if (playMode === 'timed') {
          tutorialState.timer = setTimeout(() => {
            tutorialState.waitingForInput = false;
            unhighlightKeys();
            tutorialState.index++;
            nextCue();
          }, getBeatDuration(step.beats));
        }
      }

      // --- Input Handler ---
      function triggerKey(letter) {
        letter = letter.toUpperCase();
        const config = KEYS_CONFIG.find(k => k.key === letter);
        if (!config) return;

        playNoteEngine(config.freq);

        const keyEl = getKeyEl(letter);
        if (keyEl) {
          keyEl.classList.add('active');
          setTimeout(() => keyEl.classList.remove('active'), 140);
        }

        if (currentMode === 'tutorial' && tutorialState.waitingForInput) {
          const step = SONG[tutorialState.index];

          if (step && step.key && letter === step.key.toUpperCase()) {
            tutorialState.hits++;
            tutorialState.waitingForInput = false;
            unhighlightKeys();

            const coachEl = document.getElementById('coach-target');
            coachEl.classList.add('hit');
            setTimeout(() => coachEl.classList.remove('hit'), 120);

            if (document.querySelector('input[name="playMode"]:checked').value === 'wait') {
              tutorialState.timer = setTimeout(() => {
                tutorialState.index++;
                nextCue();
              }, getBeatDuration(step.beats));
            }
          }
        }
      }

      // Touch / Pointer
      document.getElementById('keyboard-container').addEventListener('pointerdown', e => {
        const key = e.target.closest('.key');
        if (key) triggerKey(key.dataset.key);
      });

      // Physical Keyboard
      window.addEventListener('keydown', e => {
        if (e.repeat || !document.getElementById('screen-piano').classList.contains('active')) return;
        triggerKey(e.key);
      });

    })();
